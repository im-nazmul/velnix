name: Go foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o bin/velnix ./cmd/velnix
      - name: Smoke checks
        run: |
          bin/velnix version --json
          bin/velnix config validate --json
          bin/velnix doctor --json
      - name: Vulnerability scan on release toolchain
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
