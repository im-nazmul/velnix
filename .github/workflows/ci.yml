name: Go foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.22.2', '1.27.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod verify
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o bin/velnix ./cmd/velnix
      - name: Smoke checks
        run: |
          bin/velnix version --json
          bin/velnix config validate --json
          bin/velnix doctor --json
      - name: Vulnerability scan on release toolchain
        if: matrix.go == '1.27.3'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
