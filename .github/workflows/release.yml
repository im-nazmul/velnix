name: Build release binaries

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    linux-amd64:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version
            - name: Build frontend and embed it in the Linux binary
              run: sh scripts/build.sh
            - name: Check asset reproducibility and Go tests
              run: |
                  python3 scripts/check-dashboard-assets.py
                  go test -race -count=1 ./cmd/... ./internal/...
            - name: Package binary and license notices
              run: |
                  mkdir -p build/release
                  cp bin/velnix THIRD-PARTY-NOTICES.md build/release/
                  cp web/public/assets/licenses.txt build/release/dashboard-licenses.txt
                  tar -czf build/velnix-linux-amd64.tar.gz -C build/release .
                  cd build
                  sha256sum velnix-linux-amd64.tar.gz > velnix-linux-amd64.tar.gz.sha256
            - name: Attach archive and checksum to the published release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" build/velnix-linux-amd64.tar.gz build/velnix-linux-amd64.tar.gz.sha256 --clobber
